<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eaf8f1" />
  <meta name="color-scheme" content="light dark" />
  <title>Ajay Soni — AI System Builder</title>
  <meta name="description" content="Ajay Soni — AI System Builder and SAS Certified Associate. Explore professional links, projects, and contact information." />
  <meta name="author" content="Ajay Soni" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ajay Soni — AI System Builder" />
  <meta property="og:description" content="AI System Builder and SAS Certified Associate." />
  <meta property="og:image" content="/assets/profile.jpg" />
  <meta property="og:image:alt" content="Portrait of Ajay Soni" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ajay Soni — AI System Builder" />
  <meta name="twitter:description" content="AI System Builder and SAS Certified Associate." />
  <meta name="twitter:image" content="/assets/profile.jpg" />

  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Final visual refinements: preserve the established layout while making
       utility controls more proportional and giving the LinkedIn mark safe padding. */
    .icon-box--linkedin svg {
      width: 25px;
      height: 25px;
      overflow: visible;
    }

    .social-button[aria-label="LinkedIn"] svg {
      width: 19px;
      height: 19px;
      overflow: visible;
    }

    .copy-button {
      min-width: 52px;
      height: 27px;
      padding-inline: 9px;
    }

    .copy-label {
      font-size: .70rem;
    }

    .copy-check {
      width: 14px;
      height: 14px;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
    }

    .theme-icon {
      width: 19px;
      height: 19px;
    }

    @media (max-width: 355px) {
      .copy-button {
        min-width: 50px;
        height: 26px;
        padding-inline: 8px;
      }

      .theme-toggle {
        width: 39px;
        height: 39px;
      }
    }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="ambient ambient--one" aria-hidden="true"></div>
  <div class="ambient ambient--two" aria-hidden="true"></div>
  <div class="ambient ambient--three" aria-hidden="true"></div>

  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
    <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.4 15.1A8.6 8.6 0 0 1 8.9 3.6 8.6 8.6 0 1 0 20.4 15.1Z"/>
    </svg>
    <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>

  <main class="page-shell">
    <section class="profile" aria-labelledby="profile-name">
      <div class="avatar-wrap reveal" style="--delay: 40ms">
        <div class="avatar-ring">
          <img
            class="avatar"
            src="/assets/profile.jpg"
            alt="Ajay Soni"
            width="1200"
            height="1200"
            loading="eager"
            decoding="async"
          />
        </div>
        <span class="status-dot" aria-label="Available" title="Available"></span>
      </div>

      <h1 id="profile-name" class="profile-name reveal" style="--delay: 90ms">Ajay Soni</h1>
      <p class="profile-handle reveal" style="--delay: 130ms">@ajaysoni-dev</p>
      <p class="profile-headline reveal" style="--delay: 170ms">AI System Builder and SAS Certified Associate.</p>

      <div class="email-line reveal" style="--delay: 210ms">
        <a class="email-address" href="mailto:officialprofessionalmail@gmail.com">officialprofessionalmail@gmail.com</a>
        <button class="copy-button" id="copyEmail" type="button" data-email="officialprofessionalmail@gmail.com" aria-label="Copy email address">
          <span class="copy-label">Copy</span>
          <svg class="copy-check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
        </button>
      </div>
    </section>

    <nav class="link-list" aria-label="Ajay Soni links">
      <a class="link-card reveal" style="--delay: 250ms" href="mailto:officialprofessionalmail@gmail.com" aria-label="Email Ajay Soni">
        <span class="icon-box icon-box--email" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3.5 5.5h17v13h-17z"/><path d="m4.5 7 7.5 6 7.5-6"/></svg>
        </span>
        <span class="link-copy">
          <span class="link-title">Email</span>
          <span class="link-subtitle">officialprofessionalmail@gmail.com</span>
        </span>
        <span class="link-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12h13M14 7l5 5-5 5"/></svg>
        </span>
      </a>

      <a class="link-card reveal" style="--delay: 300ms" href="https://www.linkedin.com/in/ajaysoni-dev/" target="_blank" rel="noopener noreferrer" aria-label="Open Ajay Soni on LinkedIn">
        <span class="icon-box icon-box--linkedin" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.25" y="3.25" width="17.5" height="17.5" rx="2.2" fill="currentColor"/>
            <circle cx="8.05" cy="8.05" r="1.25" fill="#ffffff"/>
            <rect x="6.9" y="10.3" width="2.3" height="7.05" rx=".18" fill="#ffffff"/>
            <path d="M11.15 10.3h2.22v.97c.58-.78 1.43-1.25 2.54-1.25 2.05 0 3.05 1.31 3.05 3.75v3.58h-2.34v-3.28c0-1.36-.43-2.05-1.39-2.05-1.08 0-1.74.77-1.74 2.25v3.08h-2.34z" fill="#ffffff"/>
          </svg>
        </span>
        <span class="link-copy">
          <span class="link-title">LinkedIn</span>
          <span class="link-subtitle">Connect with me</span>
        </span>
        <span class="link-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12h13M14 7l5 5-5 5"/></svg>
        </span>
      </a>

      <a class="link-card reveal" style="--delay: 350ms" href="https://github.com/AjaySoni-Dev" target="_blank" rel="noopener noreferrer" aria-label="Open Ajay Soni on GitHub">
        <span class="icon-box icon-box--github" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="brand-fill"><path d="M12 2.25a9.75 9.75 0 0 0-3.08 19c.49.09.67-.21.67-.47v-1.86c-2.72.59-3.3-1.16-3.3-1.16-.44-1.13-1.09-1.43-1.09-1.43-.89-.61.07-.6.07-.6.98.07 1.5 1.01 1.5 1.01.88 1.5 2.3 1.07 2.86.82.09-.64.34-1.07.62-1.32-2.17-.25-4.46-1.09-4.46-4.82 0-1.06.38-1.93 1-2.61-.1-.25-.43-1.24.1-2.58 0 0 .82-.26 2.68 1a9.25 9.25 0 0 1 4.88 0c1.86-1.26 2.67-1 2.67-1 .54 1.34.2 2.33.1 2.58.63.68 1.01 1.55 1.01 2.61 0 3.75-2.29 4.57-4.47 4.81.35.3.66.9.66 1.82v2.7c0 .26.18.57.67.47A9.75 9.75 0 0 0 12 2.25Z"/></svg>
        </span>
        <span class="link-copy">
          <span class="link-title">GitHub</span>
          <span class="link-subtitle">Check out my projects</span>
        </span>
        <span class="link-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12h13M14 7l5 5-5 5"/></svg>
        </span>
      </a>

      <a class="link-card reveal" style="--delay: 400ms" href="https://www.instagram.com/im_ajay.soni/" target="_blank" rel="noopener noreferrer" aria-label="Open Ajay Soni on Instagram">
        <span class="icon-box icon-box--instagram" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17.4" cy="6.7" r="1" class="dot-fill"/></svg>
        </span>
        <span class="link-copy">
          <span class="link-title">Instagram</span>
          <span class="link-subtitle">@im_ajay.soni</span>
        </span>
        <span class="link-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12h13M14 7l5 5-5 5"/></svg>
        </span>
      </a>

      <button class="link-card link-card--button link-card--inactive reveal" style="--delay: 450ms" id="resourcesCard" type="button" aria-label="Further Resources — link coming soon" aria-disabled="true">
        <span class="icon-box icon-box--resources" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 4.5h12v15l-6-3.65L6 19.5z"/></svg>
        </span>
        <span class="link-copy">
          <span class="link-title">Further Resources</span>
          <span class="link-subtitle">Curated links &amp; tools</span>
        </span>
        <span class="link-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12h13M14 7l5 5-5 5"/></svg>
        </span>
      </button>
    </nav>

    <footer class="social-footer reveal" style="--delay: 500ms" aria-label="Social links">
      <a class="social-button" href="mailto:officialprofessionalmail@gmail.com" aria-label="Email">
        <svg viewBox="0 0 24 24"><path d="M3.5 5.5h17v13h-17z"/><path d="m4.5 7 7.5 6 7.5-6"/></svg>
      </a>
      <a class="social-button" href="https://www.linkedin.com/in/ajaysoni-dev/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" style="color: var(--muted);">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.25" y="3.25" width="17.5" height="17.5" rx="2.2" style="fill: currentColor; stroke: none;"/>
          <path d="M6.95 10.15h2.45v7.25H6.95v-7.25Zm1.23-3.72a1.42 1.42 0 1 1 0 2.84 1.42 1.42 0 0 1 0-2.84Zm3.12 3.72h2.35v.99h.03c.33-.63 1.15-1.29 2.36-1.29 2.52 0 2.99 1.66 2.99 3.82v3.73h-2.45v-3.31c0-.79-.02-1.81-1.11-1.81-1.11 0-1.28.87-1.28 1.75v3.37H11.3v-7.25Z" style="fill: #ffffff; stroke: none;"/>
        </svg>
      </a>
      <a class="social-button" href="https://github.com/AjaySoni-Dev" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <svg viewBox="0 0 24 24" class="brand-fill"><path d="M12 2.25a9.75 9.75 0 0 0-3.08 19c.49.09.67-.21.67-.47v-1.86c-2.72.59-3.3-1.16-3.3-1.16-.44-1.13-1.09-1.43-1.09-1.43-.89-.61.07-.6.07-.6.98.07 1.5 1.01 1.5 1.01.88 1.5 2.3 1.07 2.86.82.09-.64.34-1.07.62-1.32-2.17-.25-4.46-1.09-4.46-4.82 0-1.06.38-1.93 1-2.61-.1-.25-.43-1.24.1-2.58 0 0 .82-.26 2.68 1a9.25 9.25 0 0 1 4.88 0c1.86-1.26 2.67-1 2.67-1 .54 1.34.2 2.33.1 2.58.63.68 1.01 1.55 1.01 2.61 0 3.75-2.29 4.57-4.47 4.81.35.3.66.9.66 1.82v2.7c0 .26.18.57.67.47A9.75 9.75 0 0 0 12 2.25Z"/></svg>
      </a>
      <a class="social-button" href="https://www.instagram.com/im_ajay.soni/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17.4" cy="6.7" r="1" class="dot-fill"/></svg>
      </a>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">Email copied</div>
</body>
</html>
