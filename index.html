  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Final mobile polish: stronger depth/separation without changing the layout. */
    :root {
      --card: linear-gradient(135deg, rgba(255,255,255,.95), rgba(239,249,245,.88));
      --card-hover: linear-gradient(135deg, rgba(255,255,255,.98), rgba(235,248,242,.94));
      --card-border: rgba(50,119,94,.22);
      --glass: rgba(255,255,255,.82);
      --glass-strong: rgba(255,255,255,.95);
      --shadow: 0 18px 44px rgba(35,88,70,.14);
      --shadow-soft: 0 9px 26px rgba(35,88,70,.10);
    }

    html[data-theme="dark"] {
      --card: linear-gradient(135deg, rgba(33,58,48,.95), rgba(20,42,34,.91));
      --card-hover: linear-gradient(135deg, rgba(39,68,56,.98), rgba(25,49,40,.95));
      --card-border: rgba(150,220,190,.22);
      --glass: rgba(26,47,39,.86);
      --glass-strong: rgba(32,57,47,.97);
    }

    body {
      background:
        radial-gradient(95% 58% at -8% 5%, rgba(86,215,173,.24), transparent 58%),
        radial-gradient(78% 54% at 108% 11%, rgba(111,190,210,.20), transparent 60%),
        radial-gradient(78% 58% at 9% 88%, rgba(74,205,158,.18), transparent 64%),
        radial-gradient(60% 46% at 86% 75%, rgba(255,255,255,.58), transparent 70%),
        linear-gradient(150deg, #f8fcfa 0%, #edf9f4 46%, #dff3e9 100%);
    }

    html[data-theme="dark"] body {
      background:
        radial-gradient(96% 62% at -8% 6%, rgba(47,139,105,.22), transparent 60%),
        radial-gradient(78% 56% at 108% 12%, rgba(55,118,130,.18), transparent 62%),
        radial-gradient(80% 60% at 8% 90%, rgba(37,116,88,.16), transparent 65%),
        linear-gradient(150deg, #0c1713 0%, #10231b 52%, #0b1813 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(42,116,90,.13) .55px, transparent .7px);
      background-size: 18px 18px;
      opacity: .23;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 18%, #000 82%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 18%, #000 82%, transparent 100%);
    }

    html[data-theme="dark"] body::after {
      background-image: radial-gradient(circle, rgba(150,222,193,.10) .55px, transparent .7px);
      opacity: .17;
    }

    .ambient {
      filter: blur(92px);
      opacity: .67;
    }

    .ambient--one {
      width: 340px;
      height: 340px;
      background: rgba(77,211,163,.26);
    }

    .ambient--two {
      width: 310px;
      height: 310px;
      background: rgba(106,190,204,.23);
    }

    .ambient--three {
      width: 370px;
      height: 370px;
      background: rgba(64,194,145,.20);
    }

    .link-card {
      border-color: var(--card-border);
      box-shadow:
        0 1px 0 rgba(255,255,255,.90) inset,
        0 1px 0 rgba(34,91,70,.05),
        0 14px 34px rgba(34,87,69,.11),
        0 4px 12px rgba(34,87,69,.045);
    }

    .link-card::after {
      background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.06) 48%, transparent 72%);
      opacity: .92;
    }

    .icon-box {
      box-shadow: 0 5px 15px rgba(47,101,81,.085), 0 1px 0 rgba(255,255,255,.55) inset;
    }

    .social-button {
      border-color: rgba(58,119,96,.16);
      background: rgba(255,255,255,.86);
      box-shadow: 0 7px 22px rgba(35,88,70,.11), 0 1px 0 rgba(255,255,255,.70) inset;
    }

    html[data-theme="dark"] .social-button {
      background: rgba(31,54,45,.90);
      border-color: rgba(150,220,190,.16);
    }

    .icon-box--linkedin svg {
      width: 25px;
      height: 25px;
      overflow: visible;
    }

    .social-button[aria-label="LinkedIn"] {
      color: var(--muted);
    }

    .social-button[aria-label="LinkedIn"]:hover {
      color: var(--accent);
    }

    .social-button[aria-label="LinkedIn"] svg {
      width: 20px;
      height: 20px;
      overflow: visible;
      fill: currentColor;
      stroke: none;
    }

    .copy-button {
      min-width: 52px;
      height: 27px;
      padding-inline: 9px;
    }

    .copy-label {
      font-size: .70rem;
    }

    .copy-check {
      width: 14px;
      height: 14px;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
    }

    .theme-icon {
      width: 19px;
      height: 19px;
    }

    @media (max-width: 355px) {
      .copy-button {
        min-width: 50px;
        height: 26px;
        padding-inline: 8px;
      }

      .theme-toggle {
        width: 39px;
        height: 39px;
      }
    }
  </style>
  <script src="/app.js" defer></script>
</head>
